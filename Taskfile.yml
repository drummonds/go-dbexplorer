version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - go fix ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests (set DBEXPLORER_PG_DSN to also test against real PostgreSQL)
    cmds:
      - go test ./...

  demo:
    desc: Run the demo server on pglike (add DBEXPLORER_PG_DSN or -- -dsn for PostgreSQL)
    cmds:
      - go run ./cmd/demo {{.CLI_ARGS}}

  docs:build:
    desc: Build the WASM demo into docs/
    vars:
      GIT_TAG:
        sh: '[ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" || git describe --tags --always 2>/dev/null || echo dev'
    cmds:
      - mkdir -p docs
      - GOOS=js GOARCH=wasm go build -o docs/main.wasm ./cmd/demo
      - cp "$(find $(go env GOROOT) -name wasm_exec.js -print -quit)" docs/
      - sed 's/go-dbexplorer WASM demo/go-dbexplorer {{.GIT_TAG}}/' cmd/demo/templates/index.html > docs/index.html
      - task-plus md2html --file README.md --dst docs
      - task-plus md2html --file CHANGELOG.md --dst docs

  test:wasm:
    desc: WASM integration test (Node.js)
    deps: [docs:build]
    cmds:
      - node cmd/demo/wasm_test.js docs

  check:
    desc: Run fmt, vet, test, build the WASM demo and run the WASM test
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: docs:build
      - task: test:wasm

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf docs
