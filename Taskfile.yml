version: '3'

vars:
  # Stamped into the demo binaries (see cmd/demo/version.go). Pass
  # VERSION=vX.Y.Z to override the tag, as tp release does.
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT_TIME:
    sh: git log -1 --format=%cI 2>/dev/null || true
  LDFLAGS: -X main.version={{.VERSION | default .GIT_VERSION}} -X main.commitTime={{.COMMIT_TIME}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - go fix ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests (set DBEXPLORER_PG_DSN to also test against real PostgreSQL)
    cmds:
      - go test ./...

  demo:
    desc: Run the demo server on pglike (add DBEXPLORER_PG_DSN or -- -dsn for PostgreSQL)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/demo {{.CLI_ARGS}}

  docs:build:
    desc: Build the WASM demo into docs/
    cmds:
      - mkdir -p docs
      - GOOS=js GOARCH=wasm go build -ldflags "{{.LDFLAGS}}" -o docs/main.wasm ./cmd/demo
      - cp "$(find $(go env GOROOT) -name wasm_exec.js -print -quit)" docs/
      - cp cmd/demo/templates/index.html docs/index.html
      - task-plus md2html --file README.md --dst docs
      - task-plus md2html --file CHANGELOG.md --dst docs

  test:wasm:
    desc: WASM integration test (Node.js)
    deps: [docs:build]
    cmds:
      - node cmd/demo/wasm_test.js docs

  test:wasm:soak:
    desc: |
      WASM data-size soak test under wasip1 via wazero: inserts rows into a
      pglike :memory: database and measures heap. WASM_SOAK_ROWS (default
      100000) sets the target; WASM_SOAK_OUTPUT captures JSON-lines metrics.
    cmds:
      - WASM_SOAK_ROWS={{.WASM_SOAK_ROWS | default "100000"}} WASM_SOAK_OUTPUT={{.WASM_SOAK_OUTPUT | default ""}} GOWASIRUNTIME=wazero GOOS=wasip1 GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_wasip1_wasm_exec" -count=1 -run TestWASMSoakDataSize -timeout 10m -v .

  check:
    desc: Run fmt, vet, test, build the WASM demo and run the WASM test
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: docs:build
      - task: test:wasm

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf docs
